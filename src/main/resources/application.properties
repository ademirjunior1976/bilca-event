spring.application.name=bilca-event
server.port=${PORT:8080}

spring.datasource.url=${ORACLE_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_DATASOURCE_USERNAME:event_app}
spring.datasource.password=${ORACLE_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.sql.init.mode=never

server.error.include-message=always
bilca.admin-api-token=${BILCA_ADMIN_API_TOKEN:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
bilca.mail.from=${BILCA_MAIL_FROM:${GMAIL_SMTP_USERNAME:}}

# VM de producao tem so ~220MB de heap (-Xmx220m): mantenha o limite baixo por arquivo.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
