<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilca Event</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #18212f; }
        h1 { margin-bottom: 8px; } form { display: grid; gap: 12px; }
        input, button { box-sizing: border-box; padding: 12px; font-size: 16px; width: 100%; }
        button { cursor: pointer; background: #1f6feb; color: white; border: 0; border-radius: 4px; }
        .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-top: 20px; }
        #message { margin-top: 16px; font-weight: bold; }
    </style>
</head>
<body>
<h1 id="title">Cadastro de participante</h1>
<p id="eventInfo">Carregando evento...</p>
<div class="card">
    <form id="participantForm">
        <input name="name" placeholder="Nome completo" required>
        <input name="email" type="email" placeholder="E-mail" required>
        <input name="phone" placeholder="Telefone" required>
        <input name="stack" placeholder="Sua stack (ex.: Java, Oracle)" required>
        <button type="submit">Confirmar presença</button>
    </form>
    <div id="message"></div>
</div>
<script>
    const code = new URLSearchParams(location.search).get('evento');
    const message = document.getElementById('message');
    if (!code) {
        document.getElementById('eventInfo').textContent = 'Informe o evento no QR Code.';
        document.getElementById('participantForm').style.display = 'none';
    } else {
        fetch('/api/events/' + encodeURIComponent(code))
            .then(response => response.ok ? response.json() : Promise.reject())
            .then(event => document.getElementById('eventInfo').textContent =
                `${event.name} | ${event.date} | Host: ${event.host}`)
            .catch(() => {
                document.getElementById('eventInfo').textContent = 'Evento não encontrado.';
                document.getElementById('participantForm').style.display = 'none';
            });
    }
    document.getElementById('participantForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.target));
        const response = await fetch('/api/events/' + encodeURIComponent(code) + '/participants', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
        });
        const body = await response.json().catch(() => ({}));
        message.textContent = response.ok ? 'Cadastro realizado com sucesso!' : (body.message || 'Não foi possível realizar o cadastro.');
        message.style.color = response.ok ? 'green' : 'crimson';
        if (response.ok) event.target.reset();
    });
</script>
</body>
</html>
