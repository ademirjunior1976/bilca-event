<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilca Event</title>
    <style>
        :root {
            --bg: #f7f7f8;
            --card: #ffffff;
            --border: #e7e7ea;
            --text: #18181b;
            --muted: #71717a;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --success: #059669;
            --error: #dc2626;
            --shadow: 0 16px 32px -20px rgba(24, 24, 27, 0.18);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #18181b;
                --card: #202023;
                --border: #303034;
                --text: #f4f4f5;
                --muted: #a1a1aa;
                --accent: #818cf8;
                --accent-hover: #93c5fd;
                --shadow: 0 16px 32px -20px rgba(0, 0, 0, 0.6);
            }
        }
        :root[data-theme="dark"] {
            --bg: #18181b;
            --card: #202023;
            --border: #303034;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --accent: #818cf8;
            --accent-hover: #93c5fd;
            --shadow: 0 16px 32px -20px rgba(0, 0, 0, 0.6);
        }
        .theme-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 999px; flex-shrink: 0;
            border: 1.5px solid var(--border); background: var(--card); color: var(--text);
            cursor: pointer; font-size: 15px;
        }
        .theme-toggle:hover { border-color: var(--accent); }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: radial-gradient(circle at top, color-mix(in srgb, var(--accent) 12%, var(--bg)), var(--bg) 60%);
            color: var(--text);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        input, button, select, textarea { font-family: inherit; }
        .wrap { width: 100%; max-width: 440px; }
        .header-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; margin-bottom: 24px;
        }
        .brand {
            display: flex; align-items: center; gap: 10px;
        }
        .brand-logo {
            width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            display: flex; align-items: center; justify-content: center;
        }
        .brand-logo img { width: 26px; height: 26px; object-fit: contain; }
        @media (prefers-color-scheme: dark) {
            .brand-logo img { filter: invert(1); }
        }
        .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 600; color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            padding: 6px 12px; border-radius: 999px;
        }
        h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
        .meta { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 18px;
            padding: 28px; box-shadow: var(--shadow);
        }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        input {
            width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 10px;
            border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
        }
        button {
            width: 100%; margin-top: 6px; padding: 14px; font-size: 15px; font-weight: 600;
            color: white; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
            transition: background .15s, transform .1s;
        }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: .6; cursor: default; transform: none; }
        #message { margin-top: 14px; font-size: 14px; font-weight: 600; text-align: center; min-height: 20px; }
        #message.success { color: var(--success); }
        #message.error { color: var(--error); }
        .success-panel { text-align: center; padding: 12px 0; }
        .success-panel .icon {
            width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
            background: color-mix(in srgb, var(--success) 15%, transparent);
            display: flex; align-items: center; justify-content: center; font-size: 28px;
        }
        .success-panel h2 { margin: 0 0 6px; font-size: 19px; }
        .success-panel p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
        .skeleton { color: var(--muted); font-size: 14px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header-bar">
        <div class="brand">
            <span class="brand-logo"><img src="/images/bilca-systems-logo.png" alt="Bilca Systems"></span>
            <span class="brand-name">Bilca Systems</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px">
            <span class="badge">🎁 Confirmação de presença</span>
            <button class="theme-toggle" id="themeToggle" title="Alternar tema" type="button">🌙</button>
        </div>
    </div>
    <h1 id="title">Carregando evento…</h1>
    <p class="meta" id="eventInfo">&nbsp;</p>

    <div class="card">
        <div id="formArea">
            <form id="participantForm">
                <div class="field">
                    <label for="name">Nome completo</label>
                    <input id="name" name="name" required>
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="field">
                    <label for="phone">Telefone</label>
                    <input id="phone" name="phone" required>
                </div>
                <div class="field">
                    <label for="stack">Sua stack</label>
                    <input id="stack" name="stack" placeholder="ex.: Java, Oracle" required>
                </div>
                <button type="submit" id="submitBtn">Confirmar presença</button>
            </form>
            <div id="message"></div>
        </div>
        <div id="successPanel" class="success-panel" style="display:none">
            <div class="icon">✅</div>
            <h2>Presença confirmada!</h2>
        </div>
    </div>
</div>

<script>
    (function() {
        const btn = document.getElementById('themeToggle');
        let saved = null;
        try { saved = localStorage.getItem('bilca-theme'); } catch (e) {}
        if (saved) document.documentElement.setAttribute('data-theme', saved);
        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }
        function updateIcon() { btn.textContent = currentTheme() === 'dark' ? '☀️' : '🌙'; }
        updateIcon();
        btn.addEventListener('click', () => {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('bilca-theme', next); } catch (e) {}
            updateIcon();
        });
    })();

    const code = new URLSearchParams(location.search).get('evento');
    const title = document.getElementById('title');
    const eventInfo = document.getElementById('eventInfo');
    const message = document.getElementById('message');
    const formArea = document.getElementById('formArea');
    const successPanel = document.getElementById('successPanel');
    const form = document.getElementById('participantForm');
    const submitBtn = document.getElementById('submitBtn');

    function setMessage(text, type) {
        message.textContent = text;
        message.className = type || '';
    }

    if (!code) {
        title.textContent = 'Evento não informado';
        eventInfo.textContent = 'Confira o link do QR Code.';
        formArea.style.display = 'none';
    } else {
        fetch('/api/events/' + encodeURIComponent(code))
            .then(response => response.ok ? response.json() : Promise.reject())
            .then(event => {
                title.textContent = event.name;
                const date = new Date(event.date + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
                eventInfo.textContent = `${date} · ${event.location} · Host: ${event.host}`;
            })
            .catch(() => {
                title.textContent = 'Evento não encontrado';
                eventInfo.textContent = 'Confira o link do QR Code.';
                formArea.style.display = 'none';
            });
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando…';
        setMessage('', '');
        try {
            const data = Object.fromEntries(new FormData(event.target));
            const response = await fetch('/api/events/' + encodeURIComponent(code) + '/participants', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
            });
            const body = await response.json().catch(() => ({}));
            if (response.ok) {
                formArea.style.display = 'none';
                successPanel.style.display = 'block';
            } else {
                setMessage(body.message || 'Não foi possível realizar o cadastro.', 'error');
            }
        } catch (e) {
            setMessage('Falha de conexão. Tente novamente.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Confirmar presença';
        }
    });
</script>
</body>
</html>
