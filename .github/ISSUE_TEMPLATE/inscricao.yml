name: Inscrição no evento
description: Confirme sua presença para concorrer aos brindes
title: "Inscrição"
labels: ["inscricao"]
body:
  - type: input
    id: evento
    attributes:
      label: Código do evento
      description: Preenchido automaticamente pelo link do QR Code — não altere.
    validations:
      required: true
  - type: input
    id: nome
    attributes:
      label: Nome completo
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: E-mail
    validations:
      required: true
  - type: input
    id: telefone
    attributes:
      label: Telefone
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Sua stack (ex.: Java, Oracle)
    validations:
      required: true
